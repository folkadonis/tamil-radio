<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="arrow" x1="0" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="#e8bd7d"/>
      <stop offset="1" stop-color="#c08d47"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#151a20"/>
  <!-- Bow arc -->
  <path d="M9 6C6.5 9 5.5 12.5 5.5 16C5.5 19.5 6.5 23 9 26"
        stroke="#d9a761" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Bowstring -->
  <line x1="9" y1="6.8" x2="9" y2="25.2"
        stroke="#d9a761" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Arrow shaft -->
  <line x1="11" y1="16" x2="26.5" y2="16"
        stroke="url(#arrow)" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="27,16 22,13.5 23.5,16 22,18.5" fill="#e8bd7d"/>
  <!-- Fletching -->
  <path d="M13,16 L11,13.5 M13,16 L11,18.5"
        stroke="#d9a761" stroke-width="1.4" stroke-linecap="round"/>
</svg>
