<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robin Hood — Stream live Tamil radio, TV channels, cartoons and live sports.">
  <title>Robin Hood — Live Streaming</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#0f1216">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M7 7C5 11 4 15.5 4 20C4 24.5 5 29 7 33" stroke="url(#rh1)" stroke-width="2.8" stroke-linecap="round"/>
            <line x1="7" y1="8" x2="7" y2="32" stroke="url(#rh1)" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="9" y1="20" x2="35" y2="20" stroke="url(#rh1)" stroke-width="2" stroke-linecap="round"/>
            <polygon points="35,20 29,17 31,20 29,23" fill="url(#rh1)"/>
            <path d="M13,20 L11,16 M13,20 L11,24" stroke="url(#rh1)" stroke-width="1.6" stroke-linecap="round"/>
            <defs><linearGradient id="rh1" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#e8bd7d"/><stop offset="1" stop-color="#c08d47"/></linearGradient></defs>
          </svg>
        </div>
        <div>
          <h1 class="logo-text">Robin <span class="logo-accent">Hood</span></h1>
          <p class="logo-sub">Live Streaming</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="listener-wrap">
          <span class="listener-badge" id="listenerBadge" style="display:none;">
            <span class="listener-dot"></span>
            <span id="listenerCount">0</span>
          </span>
          <button id="communityBtn" class="community-btn" aria-label="Open community voice chat" title="Community Voice Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Community</span>
          </button>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search stations..." autocomplete="off">
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="radio">📻 Radio</button>
      <button class="tab" data-cat="india">🇮🇳 Chennai</button>
      <button class="tab" data-cat="tv">📺 Live TV</button>
      <button class="tab" data-cat="cartoon">🎬 Cartoon</button>
      <button class="tab" data-cat="anime">🏴‍☠️ Anime</button>
      <button class="tab" data-cat="manga">📖 Manga</button>
      <button class="tab" data-cat="movies">🍿 Movies</button>
      <button class="tab" data-cat="sports">⚽ Sports</button>
    </div>

    <!-- Radio Grid -->
    <div class="stations" id="stationGrid"></div>

    <!-- TV Grid -->
    <div class="tv-grid" id="tvGrid" style="display:none;"></div>

    <!-- Cartoon Grid -->
    <div class="cartoon-grid" id="cartoonGrid" style="display:none;"></div>

    <!-- Anime Grid -->
    <div class="cartoon-grid" id="animeGrid" style="display:none;"></div>

    <!-- Manga Grid -->
    <div class="cartoon-grid" id="mangaGrid" style="display:none;"></div>

    <!-- Movies Grid -->
    <div class="cartoon-grid" id="moviesGrid" style="display:none;"></div>

    <!-- Sports Grid -->
    <div id="sportsGrid" style="display:none;"></div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>No results found</p>
    </div>

    <!-- Now Playing Bar -->
    <div class="player" id="player">
      <div class="player-inner">
        <div class="player-info">
          <div class="player-visualizer" id="visualizer">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="player-meta">
            <p class="player-station" id="playerStation">Select a station</p>
            <p class="player-freq" id="playerFreq">—</p>
          </div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
          <button class="play-btn" id="playBtn" aria-label="Play / Pause">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
            <div class="spinner" id="spinner"></div>
          </button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2 0h2V6h-2v12z" transform="scale(-1,1) translate(-24,0)"/></svg></button>
        </div>
        <div class="player-volume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </div>

  </div>

  <!-- TV Player Modal -->
  <div class="tv-modal" id="tvModal">
    <div class="tv-modal-inner">
      <div class="tv-modal-top">
        <div class="tv-modal-info">
          <span class="live-badge"><span class="live-dot"></span> LIVE</span>
          <span class="tv-modal-name" id="tvModalName"></span>
        </div>
        <button class="tv-modal-close" id="tvModalClose" aria-label="Close TV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <video id="tvVideo" controls playsinline></video>
    </div>
  </div>

  <!-- Cartoon Player Modal -->
  <div class="cartoon-modal" id="cartoonModal">
    <div class="cartoon-modal-inner">
      <div class="cartoon-modal-top">
        <div class="tv-modal-info">
          <span class="cartoon-badge">🎬 CARTOON</span>
          <span class="tv-modal-name" id="cartoonModalName"></span>
        </div>
        <button class="tv-modal-close" id="cartoonModalClose" aria-label="Close player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <iframe id="cartoonIframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <!-- Anime Player Modal -->
  <div class="anime-modal" id="animeModal">
    <div class="anime-modal-inner">
      <div class="anime-modal-top">
        <div class="tv-modal-info">
          <span class="anime-badge">🏴‍☠️ ANIME</span>
          <span class="tv-modal-name" id="animeModalName"></span>
        </div>
        <button class="tv-modal-close" id="animeModalClose" aria-label="Close player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="anime-player-wrap">
        <video id="animeVideo" controls playsinline></video>
      </div>
      <div class="anime-ep-bar">
        <div class="anime-ep-current" id="animeEpCurrent">Loading…</div>
        <div class="anime-range-strip" id="animeRangeStrip"></div>
        <div class="anime-ep-strip" id="animeEpStrip"></div>
      </div>
    </div>
  </div>

  <!-- Manga Reader Modal -->
  <div class="manga-modal" id="mangaModal">
    <div class="manga-modal-inner">
      <div class="manga-modal-top">
        <div class="tv-modal-info">
          <span class="anime-badge">📖 MANGA</span>
          <span class="tv-modal-name" id="mangaModalName"></span>
          <span class="manga-ch-current" id="mangaChCurrent"></span>
        </div>
        <div class="manga-top-actions">
          <button class="manga-nav-btn" id="mangaPrevBtn" title="Previous chapter">‹ Prev</button>
          <button class="manga-nav-btn" id="mangaNextBtn" title="Next chapter">Next ›</button>
          <button class="tv-modal-close" id="mangaModalClose" aria-label="Close reader">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="manga-pages" id="mangaPages"></div>
      <div class="manga-ch-bar">
        <div class="manga-range-strip" id="mangaRangeStrip"></div>
        <div class="manga-ch-strip" id="mangaChStrip"></div>
      </div>
    </div>
  </div>

  <!-- Movie Player Modal -->
  <div class="cartoon-modal" id="movieModal">
    <div class="cartoon-modal-inner">
      <div class="cartoon-modal-top">
        <div class="tv-modal-info">
          <span class="cartoon-badge">🍿 MOVIE</span>
          <span class="tv-modal-name" id="movieModalName"></span>
        </div>
        <button class="tv-modal-close" id="movieModalClose" aria-label="Close player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <iframe id="movieIframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
      <video id="movieVideo" controls playsinline style="display:none;"></video>
      <div class="movie-msg" id="movieMsg" style="display:none;"></div>
    </div>
  </div>

  <!-- Community Modal -->
  <div class="community-modal" id="communityModal" aria-hidden="true">
    <div class="community-panel">
      <div class="community-header">
        <div class="community-title">
          <span class="community-live-dot"></span>
          <h2>Community Voice</h2>
        </div>
        <button class="community-close" id="communityClose" aria-label="Leave and close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="community-desc">Open mic — anyone can join and speak. Tap the mic to talk.</p>
      <div id="jitsiContainer"></div>
    </div>
  </div>

  <audio id="audioEl" preload="none"></audio>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
